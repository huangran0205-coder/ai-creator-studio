<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8b5e3c">
<title>AI Creator Studio - 接收分享</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#f5f3f0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;color:#2c241b}
  .card{background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 4px 24px rgba(0,0,0,0.08);max-width:360px;width:100%;text-align:center;animation:fadeUp .4s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .icon{font-size:56px;margin-bottom:12px;animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(0.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  h2{font-size:18px;margin:0 0 6px;font-weight:700}
  .sub{font-size:14px;color:#7a6e62;margin-bottom:16px;line-height:1.6}
  .link-info{background:#f5ede6;border-radius:12px;padding:12px;margin-bottom:20px;text-align:left;font-size:13px;word-break:break-all;line-height:1.5}
  .link-info .label{font-size:11px;color:#7a6e62;margin-bottom:4px}
  .link-info .url{color:#2c241b;font-weight:500}
  .link-info .tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;background:#e8f3f0;color:#2d7a6b;margin-top:6px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 28px;border-radius:24px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none}
  .btn-p{background:#8b5e3c;color:#fff}
  .btn-p:hover{background:#7a4e2e}
  .btn-o{background:transparent;border:1px solid #e8e2da;color:#2c241b;margin-top:8px}
  .btn-o:hover{background:#f0ede8}
  .loading{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0}
  .dot{width:8px;height:8px;border-radius:50%;background:#c49a7a;animation:dot 1.2s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}
  .hidden{display:none}
</style>
</head>
<body>

<div class="card" id="loadingCard">
  <div class="icon">📥</div>
  <h2>正在接收分享...</h2>
  <div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div class="card hidden" id="successCard">
  <div class="icon">✅</div>
  <h2>已收集到工作台！</h2>
  <div class="sub">链接已存入收集箱，可随时查看</div>
  <div class="link-info" id="linkInfo">
    <div class="label" id="linkLabel">📎 收集的链接</div>
    <div class="url" id="sharedUrl"></div>
    <div style="font-size:11px;color:var(--text3);margin-top:4px;word-break:break-all;" id="sharedFullUrl"></div>
    <div id="platformTag"></div>
  </div>
  <a class="btn btn-p" id="gotoBtn" href="index.html">📥 查看收集箱</a>
  <a class="btn btn-o" href="index.html">🏠 回到首页</a>
</div>

<div class="card hidden" id="duplicateCard">
  <div class="icon">⏳</div>
  <h2>已经收集过了</h2>
  <div class="sub">这个链接之前已经添加过了，无需重复收集</div>
  <div class="link-info" id="dupLinkInfo">
    <div class="label">📎 链接</div>
    <div class="url" id="dupUrl"></div>
  </div>
  <a class="btn btn-p" href="index.html">📥 查看收集箱</a>
  <a class="btn btn-o" href="index.html">🏠 回到首页</a>
</div>

<div class="card hidden" id="errorCard">
  <div class="icon">❌</div>
  <h2>接收失败</h2>
  <div class="sub">没有检测到有效的链接，请确认分享内容</div>
  <a class="btn btn-p" href="index.html">🏠 回到首页</a>
</div>

<script>
(function() {
  function detectPlatform(url) {
    if (!url) return 'unknown';
    if (url.includes('bilibili.com')) return 'bilibili';
    if (url.includes('douyin.com')) return 'douyin';
    if (url.includes('xiaohongshu.com') || url.includes('xhslink.com')) return 'xiaohongshu';
    if (url.includes('youtube.com') || url.includes('youtu.be')) return 'youtube';
    if (url.includes('kuaishou.com') || url.includes('gifshow.com')) return 'kuaishou';
    return 'other';
  }
  function platformEmoji(p) { return {bilibili:'📺',douyin:'🎵',xiaohongshu:'📕',youtube:'▶️',kuaishou:'🎬',other:'🔗'}[p]||'🔗'; }
  function platformName(p) { return {bilibili:'B站',douyin:'抖音',xiaohongshu:'小红书',youtube:'YouTube',kuaishou:'快手',other:'其他'}[p]||'其他'; }

  function showCard(id) {
    document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  try {
    // 尝试从 URL 参数读取（GET 方式）
    const params = new URLSearchParams(window.location.search);
    let sharedRaw = params.get('url') || params.get('text') || '';

    // 如果没有，尝试从 hash 读取
    if (!sharedRaw && window.location.hash.startsWith('#shared=')) {
      sharedRaw = decodeURIComponent(window.location.hash.slice(8));
    }

    // 从混合文本中提取 URL（快手分享常带标题）
    let sharedUrl = null;
    let sharedTitle = null;
    if (sharedRaw) {
      // 直接匹配 http 链接
      const urlMatch = sharedRaw.match(/https?:\/\/[^\s\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]+/);
      if (urlMatch) {
        sharedUrl = urlMatch[0];
        // 提取 URL 前面的文字作为标题
        const beforeUrl = sharedRaw.substring(0, sharedRaw.indexOf(sharedUrl)).trim();
        if (beforeUrl) sharedTitle = beforeUrl.replace(/[【】\s\-_|▶️🎵📺📕#]+/g, ' ').trim().slice(0, 80);
      } else if (sharedRaw.startsWith('http')) {
        sharedUrl = sharedRaw;
      }
    }

    if (sharedUrl) {
      // 检查是否已存在
      const existing = JSON.parse(localStorage.getItem('aiStudioInbox') || '[]');
      const isDuplicate = existing.some(e => e.url === sharedUrl);

      if (isDuplicate) {
        document.getElementById('dupUrl').textContent = sharedUrl;
        setTimeout(() => showCard('duplicateCard'), 600);
      } else {
        // 保存到收集箱
        const platform = detectPlatform(sharedUrl);
        const item = {
          id: Date.now(),
          url: sharedUrl,
          title: sharedTitle || platformName(platform) + '视频',
          platform: platform,
          addedAt: new Date().toISOString(),
          status: 'pending'
        };
        existing.unshift(item);
        localStorage.setItem('aiStudioInbox', JSON.stringify(existing));

        // 显示成功页面
        if (sharedTitle) {
          document.getElementById('linkLabel').textContent = '📎 标题';
        } else {
          document.getElementById('linkLabel').textContent = '📎 收集的链接';
        }
        document.getElementById('sharedUrl').textContent = sharedTitle || '视频链接';
        document.getElementById('sharedFullUrl').textContent = sharedUrl;
        document.getElementById('platformTag').innerHTML = '<span class="tag">' + platformEmoji(platform) + ' ' + platformName(platform) + '</span>';
        document.getElementById('gotoBtn').href = 'index.html?focus=inbox';
        setTimeout(() => showCard('successCard'), 800);
      }
    } else {
      setTimeout(() => showCard('errorCard'), 600);
    }
  } catch(e) {
    setTimeout(() => showCard('errorCard'), 600);
  }
})();
</script>
</body>
</html>
